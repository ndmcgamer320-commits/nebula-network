name: NebulaCore
version: 1.0.0
main: net.nebula.core.NebulaCore
api-version: '1.21.11'
author: Nebula Network
description: Protected lobby, network HUD, ranks and NPCs.
depend:
  - Citizens
commands:
  spawn:
    description: Return to the Nebula lobby.
    usage: /spawn
  setlobby:
    description: Set the protected lobby spawn.
    usage: /setlobby
    permission: nebulacore.admin
  nebula:
    description: Open the game selector.
    usage: /nebula
  menu:
    description: Open the game selector.
    usage: /menu
  settings:
    description: Open personal network settings.
    usage: /settings
  rank:
    description: View your rank or change a player's network rank.
    usage: /rank [player rank]
  rtp:
    description: Teleport to a random safe location in Survival.
    usage: /rtp
  bedwars:
    description: Open BedWars modes or leave the queue.
    usage: /bedwars [leave]
  duel:
    description: Open CPvP duels, queue, practice the bot or edit your kit.
    usage: /duel [queue|bot|edit|leave]
  arenareset:
    description: Regenerate the BedWars and Duel maps.
    usage: /arenareset [bedwars|duel|all]
    permission: nebulacore.admin
permissions:
  nebulacore.admin:
    default: op
