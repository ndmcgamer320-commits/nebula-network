name: Build NebulaCore

on:
  push:
    paths:
      - "NebulaCore/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "NebulaCore/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile and package NebulaCore
        run: mvn -B -f NebulaCore/pom.xml clean package
