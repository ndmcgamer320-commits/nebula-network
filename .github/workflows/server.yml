name: Run Nebula Network

on:
  workflow_dispatch:
    inputs:
      runtime_hours:
        description: "Server runtime (maximum 5 hours)"
        required: true
        type: choice
        options: ["1", "2", "3", "4", "5"]
        default: "5"

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore world and rank data
        uses: actions/cache@v4
        with:
          path: |
            world/
            lobby/
            survival_1/
            survival_2/
            bedwars_1/
            bedwars_2/
            pillars_1/
            pillars_2/
            duel_arena/
            plugins/NebulaCore/
            plugins/AuthMe/
            plugins/Multiverse-Core/
            plugins/Multiverse-Inventories/
            plugins/VoidWorldGenerator/
            plugins/GrimAC/
            ops.json
            server.properties
          key: nebula-server-state-${{ github.run_id }}
          restore-keys: |
            nebula-server-state-

      - name: Verify committed EULA and tunnel secret
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          if [ ! -f eula.txt ] || ! grep -qx 'eula=true' eula.txt; then
            echo "::error::Read the Minecraft EULA and commit eula.txt containing eula=true."
            exit 1
          fi
          if [ -z "$PLAYIT_SECRET" ]; then
            echo "::error::Add PLAYIT_SECRET under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download Paper 1.21.11
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip
          USER_AGENT="NebulaNetwork/1.0 (https://github.com/ndmcgamer320-commits/nebula-network)"
          BUILDS=$(curl -fsSL -H "User-Agent: $USER_AGENT" -H "Accept: application/json" https://fill.papermc.io/v3/projects/paper/versions/1.21.11/builds)
          PAPER_URL=$(echo "$BUILDS" | jq -r 'first(.[] | select(.channel == "STABLE") | .downloads."server:default".url) // "null"')
          if [ "$PAPER_URL" = "null" ] || [ -z "$PAPER_URL" ]; then
            echo "::error::No stable Paper build is available for Minecraft 1.21.11."
            echo "$BUILDS" | jq .
            exit 1
          fi
          curl -fL -H "User-Agent: $USER_AGENT" "$PAPER_URL" -o paper.jar
          test -s paper.jar
          echo "Downloaded Paper 1.21.11 from the official PaperMC downloads service."

      - name: Compile NebulaCore
        run: |
          mvn -B -f NebulaCore/pom.xml package
          mkdir -p plugins
          cp NebulaCore/target/NebulaCore-1.0.0.jar plugins/

      - name: Install Citizens NPC plugin
        run: |
          CITIZENS_URL="https://ci.citizensnpcs.co/job/Citizens2/4119/artifact/dist/target/Citizens-2.0.41-b4119.jar"
          curl -fL --retry 3 "$CITIZENS_URL" -o plugins/Citizens-2.0.41.jar
          test -s plugins/Citizens-2.0.41.jar
          jar tf plugins/Citizens-2.0.41.jar | grep -q "plugin.yml"
          echo "Citizens installed for player-model lobby NPCs."

      - name: Install authentication, world management and anti-cheat plugins
        run: |
          set -euo pipefail

          curl -fL --retry 3 \
            "https://cdn.modrinth.com/data/9js4IEHC/versions/fPuH4uYs/AuthMe-6.0.1-Paper.jar" \
            -o plugins/AuthMe-6.0.1-Paper.jar

          curl -fL --retry 3 \
            "https://hangarcdn.papermc.io/plugins/Multiverse/Multiverse-Core/versions/5.8.2/PAPER/multiverse-core-5.8.2.jar" \
            -o plugins/Multiverse-Core-5.8.2.jar

          curl -fL --retry 3 \
            "https://hangarcdn.papermc.io/plugins/Multiverse/Multiverse-Inventories/versions/5.3.2/PAPER/multiverse-inventories-5.3.2.jar" \
            -o plugins/Multiverse-Inventories-5.3.2.jar

          VWG_RELEASE=$(curl -fsSL -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/HydrolienF/VoidWorldGenerator/releases/tags/1.3.11)
          VWG_URL=$(echo "$VWG_RELEASE" | jq -r '[.assets[] | select(.name | endswith(".jar")) | .browser_download_url][0] // "null"')
          if [ "$VWG_URL" = "null" ]; then
            echo "::error::Could not locate the VoidWorldGenerator 1.3.11 release JAR."
            exit 1
          fi
          curl -fL --retry 3 "$VWG_URL" -o plugins/VoidWorldGenerator-1.3.11.jar

          GRIM_VERSIONS=$(curl -fsSL -G \
            --data-urlencode 'game_versions=["1.21.11"]' \
            --data-urlencode 'loaders=["paper"]' \
            https://api.modrinth.com/v2/project/grimac/version)
          GRIM_URL=$(echo "$GRIM_VERSIONS" | jq -r 'first(.[] | select((.game_versions | index("1.21.11")) and (.loaders | index("paper"))) | .files[] | select(.primary == true) | .url) // "null"')
          if [ "$GRIM_URL" = "null" ]; then
            echo "::error::Could not find a GrimAC build for Paper 1.21.11."
            exit 1
          fi
          curl -fL --retry 3 "$GRIM_URL" -o plugins/GrimAC.jar

          for jar in plugins/AuthMe-6.0.1-Paper.jar plugins/Multiverse-Core-5.8.2.jar plugins/Multiverse-Inventories-5.3.2.jar plugins/VoidWorldGenerator-1.3.11.jar plugins/GrimAC.jar; do
            test -s "$jar"
            jar tf "$jar" | grep -q "plugin.yml"
            echo "Verified $jar"
          done
          echo "AuthMe, Multiverse, VoidWorldGenerator and GrimAC are installed."

      - name: Start Playit tunnel
        env:
          SECRET_KEY: ${{ secrets.PLAYIT_SECRET }}
        run: |
          docker run -d --name playit --network host \
            -e SECRET_KEY="$SECRET_KEY" \
            ghcr.io/playit-cloud/playit-agent:1.0

          echo "Waiting for the Playit agent to initialize..."
          sleep 20

          echo "=== Playit container status ==="
          docker ps -a --filter name=playit

          echo "=== Playit agent logs ==="
          docker logs --tail 100 playit

          if [ "$(docker inspect -f '{{.State.Running}}' playit 2>/dev/null)" != "true" ]; then
            echo "::error::The Playit agent container stopped. See the logs above."
            exit 1
          fi

      - name: Run Minecraft server
        env:
          RUNTIME_HOURS: ${{ inputs.runtime_hours }}
        run: |
          SECONDS_TO_RUN=$((RUNTIME_HOURS * 3600))
          java -Xms2G -Xmx5G -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -jar paper.jar --nogui &
          SERVER_PID=$!
          END=$(( $(date +%s) + SECONDS_TO_RUN ))
          while kill -0 "$SERVER_PID" 2>/dev/null && [ "$(date +%s)" -lt "$END" ]; do sleep 15; done
          if kill -0 "$SERVER_PID" 2>/dev/null; then
            echo "Runtime reached. Sending graceful stop."
            kill -TERM "$SERVER_PID"
            for i in $(seq 1 30); do
              kill -0 "$SERVER_PID" 2>/dev/null || break
              sleep 2
            done
            kill -KILL "$SERVER_PID" 2>/dev/null || true
          fi

      - name: Collect Playit logs
        if: always()
        run: docker logs playit > playit.log 2>&1 || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nebula-network-session-logs
          path: |
            logs/
            playit.log
          if-no-files-found: ignore
          retention-days: 3
