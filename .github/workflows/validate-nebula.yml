name: Validate NebulaCore

on:
  push:
    paths:
      - "NebulaCore/**"
      - ".github/workflows/validate-nebula.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile NebulaCore
        run: mvn -B -f NebulaCore/pom.xml package
